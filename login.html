<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Form</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Left Side: Form -->
        <div class="login-left">
            <h2>Welcome Back 👋</h2>
            <form>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Example@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
                </div>
                
                <!-- Added Remember Me and Forgot Password row -->
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                
                <button type="submit" class="submit-btn">Sign in</button>
                
                <div class="divider">
                    <span>Or continue with</span>
                </div>
                
                <div class="social-login">
                    <button type="button" class="social-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google
                    </button>
                    <button type="button" class="social-btn">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"> Facebook
                    </button>
                </div>
            </form>
            
            <p class="signup-text">Don't you have an account? <a href="signup.html">Sign up</a></p>
        </div>

        <!-- Right Side: Decorative Image -->
        <div class="login-right">
            <div class="image-container"></div>
        </div>

    </div>

</body>
</html>
