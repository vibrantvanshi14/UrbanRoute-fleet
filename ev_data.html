<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Setup — Urban Route Fleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ev_data.css" />
</head>
<body>

  <div class="setup-shell">
    <header class="top-nav">
      <a href="about.html" class="logo">
        <span class="logo-mark"></span>
        <div class="logo-text">
          Urban Route Fleet
          <span>EV TRIPS MADE EASIER</span>
        </div>
      </a>
      <a href="login.html" class="nav-back">← Sign out</a>
    </header>

    <main class="setup-main">
      <div class="outer-card">
        <section class="inner-card">
          <header class="card-header">
            <div>
              <p class="eyebrow">VEHICLE SETUP</p>
              <h1 class="title">Locate your EV</h1>
            </div>
            <div class="car-badge" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
              </svg>
            </div>
          </header>

          <form id="evSetupForm" novalidate>
            <!-- Card 1: Real GPS Location -->
            <div class="status-card" id="locationCard">
              <div class="status-left">
                <div class="icon-box icon-peach" id="locationIconBox" aria-hidden="true">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21s-6-5.33-6-10a6 6 0 1 1 12 0c0 4.67-6 10-6 10Z" />
                    <circle cx="12" cy="11" r="2.2" />
                  </svg>
                </div>
                <div class="status-text">
                  <h2 id="locationTitle">Location not detected</h2>
                  <p id="locationSubtitle">Allow GPS access to detect your EV's live location</p>
                </div>
              </div>
              <button type="button" class="action-link" id="detectLocationBtn">Detect</button>
            </div>

            <!-- Card 2: EV Details Form -->
            <div class="form-card">
              <div class="field-group">
                <label for="evName">EV Vehicle Name</label>
                <input
                  type="text"
                  id="evName"
                  name="evName"
                  placeholder="e.g., Ather 450X, Tata Nexon EV"
                  autocomplete="off"
                  required
                />
                <small class="field-error" id="evNameError"></small>
              </div>

              <div class="field-row">
                <div class="field-group">
                  <label for="evBattery">Battery (%)</label>
                  <input
                    type="number"
                    id="evBattery"
                    name="evBattery"
                    placeholder="0 – 100"
                    min="0"
                    max="100"
                    step="1"
                    required
                  />
                  <small class="field-error" id="evBatteryError"></small>
                </div>

                <div class="field-group">
                  <label for="evRange">Range (km)</label>
                  <input
                    type="number"
                    id="evRange"
                    name="evRange"
                    placeholder="Remaining km"
                    min="0"
                    step="1"
                    required
                  />
                  <small class="field-error" id="evRangeError"></small>
                </div>
              </div>
            </div>

            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

            <button type="submit" class="primary-btn" id="saveBtn" disabled>
              <span>Save and continue</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m9 18 6-6-6-6" />
              </svg>
            </button>

            <div class="secondary-actions">
              <button type="button" class="clear-btn" id="clearBtn">Clear details</button>
            </div>
          </form>

          <p class="footer-note">Enter all EV details and detect live GPS location to continue.</p>
        </section>
      </div>
    </main>
  </div>

  <script src="ev_data.js"></script>
</body>
</html>
