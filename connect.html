<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pair Your Vehicle</title>
    <link href="connect.css" rel="stylesheet"> 
</head>
<body>

    <div class="outer-card">
        <div class="inner-card">

            <!-- Header -->
            <div class="header">
                <div>
                    <div class="eyebrow">CONNECTION SETUP</div>
                    <h1 class="title">Pair your vehicle</h1>
                </div>
                <div class="car-badge" aria-hidden="true">
                    
                </div>
            </div>

            <!-- Status Rows -->
            <div class="status-list">

                <!-- Location Card -->
                <div class="status-card">
                    <div class="status-left">
                        <div id="location-icon" class="icon-box icon-peach">
                            <!-- Location Pin Icon -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                        </div>
                        <div>
                            <div id="location-title" class="status-title">Location is blocked</div>
                            <div id="location-subtitle" class="status-subtitle">Allow access in browser settings</div>
                        </div>
                    </div>
                    <button id="fix-btn" class="fix-btn" type="button">Fix</button>
                </div>

                <!-- Bluetooth Card -->
                <div class="status-card">
                    <div class="status-left">
                        <div class="icon-box icon-blue">
                            <!-- Bluetooth Icon -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="m7 7 10 10-5 5V2l5 5L7 17"/>
                            </svg>
                        </div>
                        <div>
                            <div id="bt-title" class="status-title">Bluetooth pairing</div>
                            <div id="bt-subtitle" class="status-subtitle">Find a nearby vehicle</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Primary Action Button -->
            <button id="action-btn" class="primary-btn" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 7 10 10-5 5V2l5 5L7 17"/>
                </svg>
                <span id="action-text">Check location &amp; continue</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 18 6-6-6-6"/>
                </svg>
            </button>

            <!-- Footer -->
            <p class="footer-note">Keep your vehicle nearby and place it in pairing mode.</p>

        </div>
    </div>

    <script src="connect.js">
    </script>
</body>
</html>
