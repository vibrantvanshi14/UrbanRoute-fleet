<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban-Route-Fleet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="about.css">
</head>
<body>

  <!-- PAGE LOADER WITH LIVE PERCENTAGE -->
  <div class="page-loader" id="pageLoader">
    <div class="loader-logo">Urban Route Fleet</div>
    <div class="loader-percent" id="loaderPercent">0%</div>
  </div>

  <!-- NAVIGATION -->
  <header class="navbar" id="navbar">
    <div class="nav-left">
      <a href="#about" class="nav-link">ABOUT</a>
      <a href="#contact-us" class="nav-link">CONTACT</a>
      <a href="login.html" class="nav-link">LOGIN</a>
    </div>

    <div class="logo">
      Urban Route Fleet
      <span>EV TRIPS MADE EASIER</span>
    </div>
  </header>

  <!-- HERO SECTION WITH INTERACTIVE POLLEN CANVAS -->
  <section class="hero observe-me" id="heroSection">
    <canvas id="pollenCanvas"></canvas>

    <h1 class="hero-title velocity-skew zoom-text" id="heroTitle">
      <span class="reveal-mask"><span class="reveal-line delay-1">TRAVEL MADE</span></span>
      <span class="reveal-mask"><span class="reveal-line delay-2">EFFORTLESS</span></span>
    </h1>

    <div class="ev-animation-stage">
      <svg viewBox="0 0 1440 320" class="ev-scene-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="beamGrad" x1="1" y1="0.5" x2="0" y2="0.5">
            <stop offset="0%" stop-color="#FFF9D2" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#FFF9D2" stop-opacity="0" />
          </linearGradient>
          <filter id="energyGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <ellipse cx="720" cy="278" rx="680" ry="10" fill="rgba(0, 0, 0, 0.12)" />

        <!-- CHARGING STATION -->
        <g class="charging-station" transform="translate(470, 75)">
          <rect x="-12" y="190" width="94" height="14" rx="5" fill="#23372D" />
          <rect x="0" y="0" width="70" height="192" rx="14" fill="#365345" stroke="#263B31" stroke-width="2" />
          <rect x="19" y="14" width="32" height="32" rx="9" fill="#294136" />
          <path d="M28 38 C28 26, 42 22, 44 22 C44 32, 36 38, 28 38 Z M28 38 L37 29" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <rect x="10" y="56" width="50" height="64" rx="6" fill="#17241E" stroke="#4A6B5B" stroke-width="1.5" />
          <text id="ev-battery-pct" x="35" y="82" fill="#4ADE80" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">20%</text>
          <rect x="17" y="94" width="36" height="12" rx="3" fill="#263B31" />
          <rect class="battery-fill-bar" x="19" y="96" width="7" height="8" rx="2" fill="#4ADE80" />
          <rect x="68" y="105" width="8" height="24" rx="3" fill="#23372D" />
        </g>

        <path class="charging-cable-base" d="M 544 192 C 570 250, 615 250, 645 227" fill="none" stroke="#23372D" stroke-width="5" stroke-linecap="round" />
        <path class="charging-cable-pulse" d="M 544 192 C 570 250, 615 250, 645 227" fill="none" stroke="#4ADE80" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 14" filter="url(#energyGlow)" />

        <g class="scooty-mover">
          <g class="scooty-chassis">
            <polygon class="scooty-beam" points="18,62 -115,28 -115,110" fill="url(#beamGrad)" />
            <line class="scooty-kickstand" x1="88" y1="138" x2="104" y2="138" stroke="#23372D" stroke-width="4" stroke-linecap="round" />
            
            <g transform="translate(152, 138)">
              <g class="scooty-wheel">
                <circle r="24" fill="#1E2421" />
                <circle r="15" fill="#DEE8DD" />
                <line x1="-15" y1="0" x2="15" y2="0" stroke="#365345" stroke-width="3" />
                <line x1="0" y1="-15" x2="0" y2="15" stroke="#365345" stroke-width="3" />
                <circle r="5" fill="#365345" />
              </g>
            </g>

            <g transform="translate(32, 138)">
              <g class="scooty-wheel">
                <circle r="24" fill="#1E2421" />
                <circle r="15" fill="#DEE8DD" />
                <line x1="-15" y1="0" x2="15" y2="0" stroke="#365345" stroke-width="3" />
                <line x1="0" y1="-15" x2="0" y2="15" stroke="#365345" stroke-width="3" />
                <circle r="5" fill="#365345" />
              </g>
            </g>

            <path d="M 8 130 A 26 26 0 0 1 54 122" fill="none" stroke="#365345" stroke-width="6" stroke-linecap="round" />
            <path d="M 28 134 L 46 50 L 34 30 L 48 26 L 60 124 L 114 124 C 118 88, 168 88, 174 126 C 174 136, 164 138, 152 138 Z" fill="#DEE8DD" stroke="#365345" stroke-width="3" stroke-linejoin="round" />
            <path d="M 118 118 C 125 98, 158 98, 164 118 Z" fill="#365345" />
            <rect x="106" y="76" width="54" height="15" rx="7" fill="#23372D" />
            <rect x="26" y="22" width="18" height="7" rx="3.5" fill="#23372D" />
            <circle cx="24" cy="58" r="8" fill="#365345" />
            <ellipse cx="19" cy="58" rx="3" ry="6" fill="#FFF9D2" />
            <circle class="scooty-port" cx="65" cy="112" r="5.5" fill="#23372D" stroke="#365345" stroke-width="2" />
          </g>
        </g>
      </svg>
    </div>
  </section>


  <!-- FOOTER -->
  <footer class="footer observe-me">
    <div class="footer-top">
      <a href="mailto:helpline@urbanroutefleet.com">CONTACT US</a>
    </div>
    <div class="footer-bottom">
      <div>© 2026 Urban Route Fleet. All rights reserved</div>
      <div class="footer-bottom-links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms & Conditions</a>
      </div>
    </div>
  </footer>

  <script src="about.js"></script>
</body>
</html>
