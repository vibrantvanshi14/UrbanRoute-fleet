<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Left Side: Form Area -->
        <div class="login-left">
            <h2>Get Started ✨</h2>
            <p class="subtitle">Create your account to continue exploring.</p>
            
            <form action="choose_option.html" method="GET">
                <!-- Full Name Input -->
                <div class="input-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Example@email.com" required>
                </div>
                
                <!-- Password Input -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
                </div>
                
                <!-- Terms & Actions -->
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" name="terms" required> I agree to terms
                    </label>
                    <a href="#" class="forgot-link">Help?</a>
                </div>
                
                <!-- Sign Up Button -->
                <button type="submit" class="submit-btn">Next</button>
                
                <!-- Divider -->
                <div class="divider">
                    <span>Or sign up with</span>
                </div>
                
                <!-- Social Buttons -->
                <div class="social-login">
                    <button type="button" class="social-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google
                    </button>
                    <button type="button" class="social-btn">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"> Facebook
                    </button>
                </div>
            </form>
            
            <!-- Bottom Text -->
            <p class="signup-text">Already have an account? <a href="login.html">Sign in</a></p>
            
            <div class="copyright">
                &copy; 2026 All Rights Reserved.
            </div>
        </div>

        <!-- Right Side: Image Area -->
        <div class="login-right">
            <div class="image-container"></div>
        </div>

    </div>

</body>
</html>
